[package]
name = "rustlilm-studio"
version = "0.1.0"
edition = "2021"
description = "A native image and video studio for LiteLLM gateways"
license = "MIT"
repository = "https://github.com/BechirEsp/RustLiLm-studio"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui-component", "dep:gpui-component-assets", "dep:rfd"]

[[bin]]
name = "rustlilm-studio"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.4.0", optional = true }
gpui-component-assets = { version = "=0.4.0", optional = true }
rfd = { version = "0.15", optional = true }

# GPUI 0.2.2's xattr 0.2 dependency still uses libc's ENOATTR alias.
# Newer libc releases remove it on Linux; keep this compatible version locked.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Bechir Ferjani"
copyright = "2026 Bechir Ferjani"
section = "graphics"
priority = "optional"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libvulkan1, xdg-desktop-portal"
assets = [
  ["target/release/rustlilm-studio", "usr/bin/", "755"],
  ["packaging/rustlilm-studio.desktop", "usr/share/applications/", "644"],
  ["README.md", "usr/share/doc/rustlilm-studio/README.md", "644"],
]
